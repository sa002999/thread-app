<template id="content-edit-template">
  <form class="space-y-3" data-content-edit-form>
    <label class="sr-only" data-edit-label>編輯內容</label>
    <textarea class="min-h-32 w-full resize-y rounded-xl border border-neutral-300 p-3 text-base outline-none focus:border-neutral-700 focus:ring-2 focus:ring-neutral-200" maxlength="500" data-edit-input></textarea>
    <div class="flex flex-wrap items-center gap-2">
      <button class="rounded-full bg-neutral-950 px-4 py-2 text-sm font-semibold text-white" type="submit">儲存</button>
      <button class="rounded-full border border-neutral-300 px-4 py-2 text-sm font-semibold hover:bg-neutral-100" type="button" data-edit-cancel>取消</button>
      <button class="ml-auto rounded-full px-4 py-2 text-sm font-semibold text-red-700 hover:bg-red-50" type="button" data-content-delete>刪除</button>
    </div>
    <p class="text-sm text-red-700" role="alert" data-edit-error hidden></p>
  </form>
</template>

<dialog class="m-auto w-[calc(100%-2rem)] max-w-sm rounded-2xl p-5 shadow-xl backdrop:bg-neutral-950/40" id="delete-confirm" aria-labelledby="delete-confirm-title" aria-describedby="delete-confirm-description">
  <h2 class="text-lg font-bold" id="delete-confirm-title">刪除這則內容？</h2>
  <p class="mt-2 text-sm text-neutral-600" id="delete-confirm-description">刪除後會保留回覆串，內容會顯示為已刪除。</p>
  <div class="mt-5 flex justify-end gap-2">
    <button class="rounded-full border border-neutral-300 px-4 py-2 text-sm font-semibold hover:bg-neutral-100" type="button" data-delete-cancel>取消</button>
    <button class="rounded-full bg-red-700 px-4 py-2 text-sm font-semibold text-white hover:bg-red-800" type="button" data-delete-confirm>刪除</button>
  </div>
</dialog>

<template id="list-loading-template">
  <div class="flex items-center justify-center gap-3 p-8 text-sm text-neutral-600" role="status" aria-live="polite">
    <i class="fa-solid fa-spinner animate-spin" aria-hidden="true"></i><span>載入中…</span>
  </div>
</template>
<template id="list-empty-template">
  <div class="p-8 text-center text-neutral-600" role="status">
    <i class="fa-regular fa-comment-dots mb-3 text-2xl" aria-hidden="true"></i><p data-empty-message>目前還沒有內容</p>
  </div>
</template>
<template id="list-error-template">
  <div class="flex flex-col items-center gap-3 p-8 text-center" role="alert">
    <p class="text-sm text-red-700">載入失敗，請稍後重試。</p>
    <button class="rounded-full border border-neutral-300 px-4 py-2 text-sm font-semibold hover:bg-neutral-100 focus-visible:outline-2 focus-visible:outline-neutral-900" type="button" data-list-retry>重試</button>
  </div>
</template>
<template id="list-sentinel-template"><div class="h-1" aria-hidden="true" data-list-sentinel></div></template>
