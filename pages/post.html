<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thread · 貼文</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  </head>
  <body data-page="post" class="min-h-screen bg-neutral-50 text-neutral-950">
    <div data-site-header></div>
    <main class="mx-auto max-w-2xl px-0 pb-10 sm:px-5 sm:py-8">
      <div class="border-b border-neutral-200 px-4 py-5 sm:border-0 sm:px-0 sm:py-0">
        <a class="mb-3 inline-flex items-center gap-2 text-sm font-medium text-neutral-600 hover:text-neutral-950" href="/">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>回到首頁
        </a>
        <h1 class="text-2xl font-bold">貼文串</h1>
      </div>
      <section class="mt-4 overflow-hidden border-y border-neutral-200 bg-white sm:rounded-2xl sm:border" aria-label="貼文與留言">
        <div data-post-detail>
          <div class="p-8 text-center text-neutral-600" role="status"><i class="fa-solid fa-spinner mb-3 animate-spin text-2xl" aria-hidden="true"></i><p>載入中…</p></div>
        </div>
        <div class="border-t border-neutral-200 px-4 py-4 sm:px-6">
          <h2 class="text-lg font-bold">留言</h2>
          <div class="mt-3" data-comments-list>
            <p class="p-4 text-center text-sm text-neutral-500" role="status">載入留言中…</p>
          </div>
        </div>
      </section>
    </main>
    <script src="/static/site.js" defer></script>
    <script src="/static/images.js" defer></script>
    <script src="/static/posts.js" defer></script>
    <script src="/static/comments.js" defer></script>
    <script src="/static/auth.js" defer></script>
  </body>
</html>
