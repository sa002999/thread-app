<template id="post-card-template">
  <article class="border-b border-neutral-200 bg-white px-4 py-5 sm:px-6" data-post-card>
    <div class="flex gap-3">
      <div class="flex size-10 shrink-0 items-center justify-center rounded-full bg-neutral-100 text-neutral-600" aria-hidden="true">
        <i class="fa-regular fa-user"></i>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-baseline gap-x-2 gap-y-0.5">
          <a class="font-semibold text-neutral-950 hover:underline" href="#" data-author>顯示名稱</a>
          <time class="text-sm text-neutral-500" data-created-at datetime="">剛剛</time>
        </div>
        <a class="mt-2 block whitespace-pre-wrap break-words text-[15px] leading-6 text-neutral-900" href="#" data-post-body>貼文內容</a>
        <div class="mt-3 grid gap-2 overflow-hidden rounded-2xl" data-post-images hidden></div>
        <div class="mt-3 flex items-center gap-5 text-sm text-neutral-600">
          <a class="inline-flex min-h-10 items-center gap-2 rounded-full hover:text-neutral-950 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900" href="#" data-reply-link aria-label="回覆貼文">
            <i class="fa-regular fa-comment" aria-hidden="true"></i><span data-reply-count>回覆</span>
          </a>
          <button class="inline-flex min-h-10 items-center gap-2 rounded-full hover:text-rose-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-neutral-900" type="button" data-like-button aria-label="按讚貼文">
            <i class="fa-regular fa-heart" aria-hidden="true"></i><span data-like-count>讚</span>
          </button>
        </div>
      </div>
      <button class="size-10 shrink-0 rounded-full text-neutral-500 hover:bg-neutral-100 focus-visible:outline-2 focus-visible:outline-neutral-900" type="button" aria-label="更多貼文操作">
        <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>
      </button>
    </div>
  </article>
</template>
