<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thread · 首頁</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  </head>
  <body data-page="home" class="min-h-screen bg-neutral-50 text-neutral-950">
    <div data-site-header></div>
    <main class="mx-auto max-w-2xl px-0 pb-10 sm:px-5 sm:pt-8">
      <div class="border-b border-neutral-200 px-4 py-5 sm:border-0 sm:px-0 sm:py-0">
        <h1 class="text-2xl font-bold">首頁</h1>
        <p class="mt-1 text-sm text-neutral-500">看看大家正在分享什麼</p>
      </div>
      <form class="mx-0 mt-4 hidden border-y border-neutral-200 bg-white p-4 sm:rounded-2xl sm:border sm:p-5" data-create-post>
        <label class="sr-only" for="new-post-body">撰寫貼文</label>
        <textarea class="min-h-28 w-full resize-y rounded-xl border border-neutral-300 p-3 text-base outline-none placeholder:text-neutral-400 focus:border-neutral-700 focus:ring-2 focus:ring-neutral-200" id="new-post-body" name="body" maxlength="500" placeholder="分享你的想法……" required></textarea>
        <div class="mt-3 flex items-center justify-between gap-3">
          <div>
            <label class="inline-flex min-h-10 cursor-pointer items-center gap-2 rounded-full px-3 text-sm font-semibold text-neutral-700 hover:bg-neutral-100" for="new-post-images"><i class="fa-regular fa-image" aria-hidden="true"></i>加入圖片</label>
            <input class="sr-only" id="new-post-images" type="file" accept="image/jpeg,image/png,image/webp" multiple data-post-images>
            <p class="text-xs text-neutral-500">最多 500 字、3 張圖片；上限 20 MB／原圖，壓縮後 5 MB。</p>
          </div>
          <button class="rounded-full bg-neutral-950 px-5 py-2.5 text-sm font-semibold text-white disabled:opacity-50" type="submit">發布</button>
        </div>
        <div class="flex flex-wrap gap-2" aria-label="所選圖片預覽" data-post-image-preview></div>
        <p class="mt-2 text-sm text-red-700" role="alert" data-create-error hidden></p>
      </form>
      <section class="mt-4 overflow-hidden border-y border-neutral-200 bg-white sm:rounded-2xl sm:border" aria-label="最新貼文" data-post-list>
        <div class="p-8 text-center text-neutral-600" role="status" data-initial-loading>
          <i class="fa-solid fa-spinner mb-3 animate-spin text-2xl" aria-hidden="true"></i><p>載入中…</p>
        </div>
      </section>
    </main>
    <script src="/static/site.js" defer></script>
    <script src="/static/images.js" defer></script>
    <script src="/static/posts.js" defer></script>
    <script src="/static/auth.js" defer></script>
  </body>
</html>
